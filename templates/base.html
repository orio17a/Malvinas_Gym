{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Malvinas Gym | Barrio Piedrabuena
        {% endblock %}
    </title>

    <!-- Favicon -->
    <link rel="icon"
          type="image/png"
          href="{% static 'core/img/favicon.png' %}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet"
          href="{% static 'core/css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

    {% block body %}{% endblock %}

    {% block extra_js %}{% endblock %}

</body>
</html>
